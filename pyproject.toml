[project]
name = "agent-hpo"
version = "0.1.0"
description = "Local-first machine learning HPO agent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "jinja2==3.1.6",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "numpy==2.4.6",
    "psutil==7.2.2",
    "optuna==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
